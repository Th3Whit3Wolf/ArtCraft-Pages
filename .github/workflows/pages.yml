name: Build ArtCraft web apps site

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
    inputs:
      prereleases:
        description: "Include pre-releases"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "extra-apps.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Keeps already-downloaded apps between runs so unchanged versions are skipped.
      - name: Restore previous build
        uses: actions/cache@v4
        with:
          path: site
          key: artcraft-site-${{ github.run_id }}
          restore-keys: artcraft-site-

      - name: Build site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_site.py --org storytold --out site \
            ${{ inputs.prereleases && '--prereleases' || '' }}
          du -sh site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
